<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель управления | Андрей и Анна</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #7b836d;
            --bg: #fffdfa;
            --text: #1a1a1a;
            --muted: #666;
            --line: #e7e1d8;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            background: var(--bg);
            background-image: url("https://www.transparenttextures.com/patterns/natural-paper.png");
            color: var(--text);
            min-height: 100vh;
        }

        /* Password Overlay */
        #loginOverlay {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            max-width: 400px;
            width: 100%;
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid var(--line);
        }

        .login-card h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            height: 50px;
            border-radius: 25px;
            border: 1px solid var(--line);
            padding: 0 20px;
            margin-bottom: 20px;
            font-size: 1rem;
            text-align: center;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover { opacity: 0.9; transform: translateY(-2px); }

        /* Main Content */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
            display: none;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.5rem;
            margin: 0;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        /* Stats */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid var(--line);
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }

        .stat-card h3 { font-size: 0.8rem; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; letter-spacing: 0.1em; }
        .stat-card p { font-size: 2rem; font-weight: 300; margin: 0; color: var(--primary); }

        /* Filters */
        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .filters select, .filters input {
            width: 100%;
            height: 45px;
            border-radius: 10px;
            border: 1px solid var(--line);
            padding: 0 15px;
            font-family: inherit;
            font-size: 0.9rem;
            background: white;
            outline: none;
        }

        .filters select:focus, .filters input:focus {
            border-color: var(--primary);
        }

        /* Table */
        .table-container {
            background: white;
            border-radius: 15px;
            border: 1px solid var(--line);
            overflow-x: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            min-width: 600px;
        }

        th {
            padding: 20px;
            background: #f9f8f5;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--line);
        }

        td {
            padding: 20px;
            border-bottom: 1px solid #fcfbf8;
            font-size: 0.95rem;
        }

        .status-tag {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .status-yes { background: #eef4eb; color: #5b6650; }
        .status-no { background: #fdf2f2; color: #d75866; }

        .loader {
            text-align: center;
            padding: 50px;
            font-style: italic;
            color: var(--muted);
        }

        @media (max-width: 600px) {
            header h1 { font-size: 1.8rem; }
            .stat-card p { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-card">
            <h2>Вход в панель</h2>
            <input type="password" id="passwordInput" placeholder="Введите пароль">
            <button onclick="checkPassword()">Войти</button>
            <p id="errorMsg" style="color: #d75866; display: none; margin-top: 15px; font-size: 0.9rem;">Неверный пароль</p>
        </div>
    </div>

    <div class="container" id="mainContent">
        <header>
            <h1>Список гостей</h1>
            <p style="color: var(--muted)">Управление подтверждениями RSVP</p>
        </header>

        <div class="stats">
            <div class="stat-card">
                <h3>Всего ответов</h3>
                <p id="statTotal">0</p>
            </div>
            <div class="stat-card">
                <h3>Придут</h3>
                <p id="statYes">0</p>
            </div>
            <div class="stat-card">
                <h3>Не смогут</h3>
                <p id="statNo">0</p>
            </div>
        </div>

        <div class="filters">
            <div class="filter-group">
                <input type="text" id="searchInput" placeholder="Поиск по имени..." oninput="handleFilters()">
            </div>
            <div class="filter-group">
                <select id="statusFilter" onchange="handleFilters()">
                    <option value="all">Все статусы</option>
                    <option value="yes">Придут</option>
                    <option value="no">Не придут</option>
                </select>
            </div>
            <div class="filter-group">
                <select id="drinkFilter" onchange="handleFilters()">
                    <option value="all">Все напитки</option>
                    <option value="Вино белое">Вино белое</option>
                    <option value="Вино красное">Вино красное</option>
                    <option value="Водка">Водка</option>
                    <option value="Виски">Виски</option>
                    <option value="Безалкогольные напитки">Безалкогольные напитки</option>
                </select>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Имя гостя</th>
                        <th>Статус</th>
                        <th>Напитки</th>
                        <th>Дата записи</th>
                    </tr>
                </thead>
                <tbody id="guestTableBody">
                    <!-- Data will be loaded here -->
                </tbody>
            </table>
            <div id="loader" class="loader">Загрузка данных...</div>
        </div>
    </div>

    <script>
        const API_URL = 'https://sheetdb.io/api/v1/5wq032yityxfb';
        const CORRECT_PASSWORD = 'wedding2026';
        let GUEST_DATA = [];

        function checkPassword() {
            const input = document.getElementById('passwordInput').value;
            if (input === CORRECT_PASSWORD) {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                loadData();
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }

        async function loadData() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                // Sort by date (newest first)
                data.reverse();
                GUEST_DATA = data;

                renderStats(data);
                renderTable(data);
                document.getElementById('loader').style.display = 'none';
            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('loader').textContent = 'Ошибка загрузки данных.';
            }
        }

        function handleFilters() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;
            const drinkFilter = document.getElementById('drinkFilter').value;

            const filtered = GUEST_DATA.filter(item => {
                const nameMatch = (item.name || '').toLowerCase().includes(searchTerm);
                
                const isComing = item.status === 'Я приду' || item.status === 'Мы придем' || item.status === 'Обязательно приду (придём)';
                const statusMatch = statusFilter === 'all' || 
                                   (statusFilter === 'yes' && isComing) || 
                                   (statusFilter === 'no' && !isComing);
                
                const drinkMatch = drinkFilter === 'all' || 
                                  (item.drinks || '').includes(drinkFilter);

                return nameMatch && statusMatch && drinkMatch;
            });

            renderTable(filtered);
        }

        function renderStats(data) {
            const total = data.length;
            const yes = data.filter(item => item.status === 'Я приду' || item.status === 'Мы придем' || item.status === 'Обязательно приду (придём)').length;
            const no = total - yes;

            document.getElementById('statTotal').textContent = total;
            document.getElementById('statYes').textContent = yes;
            document.getElementById('statNo').textContent = no;
        }

        function renderTable(data) {
            const tbody = document.getElementById('guestTableBody');
            tbody.innerHTML = '';

            data.forEach(item => {
                const isComing = item.status === 'Я приду' || item.status === 'Мы придем' || item.status === 'Обязательно приду (придём)';
                const row = document.createElement('tr');
                
                row.innerHTML = `
                    <td><strong>${item.name || '—'}</strong></td>
                    <td>
                        <span class="status-tag ${isComing ? 'status-yes' : 'status-no'}">
                            ${isComing ? 'Придет' : 'Не придет'}
                        </span>
                    </td>
                    <td style="color: var(--muted); font-size: 0.85rem;">${item.drinks || '—'}</td>
                    <td style="color: var(--muted); font-size: 0.85rem;">${item.datetime || '—'}</td>
                `;
                tbody.appendChild(row);
            });
        }

        // Allow Enter key to submit password
        document.getElementById('passwordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkPassword();
        });
    </script>
</body>
</html>
